<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of ShopLedger with verified browser, server, route, library, config, and JSON store modules. Numbered arrows trace order placement.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033;font-size:13px}
      .title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#526078}
      .head{font-size:15px;font-weight:700}.box{fill:#fff;stroke:#b9c4d3;stroke-width:1.4;rx:9}
      .soft{fill:#f4f7fb;stroke:#b9c4d3;stroke-width:1.4;rx:9}
      .focus{fill:#fff1db;stroke:#e39a24;stroke-width:2;rx:9}
      .support{fill:#fff8ea;stroke:#e6b55f;stroke-width:1.6;rx:9}
      .small{font-size:12px;fill:#526078}.tiny{font-size:12px;fill:#526078}
      .edge{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#flowArrow)}
      .flowdash{fill:none;stroke:#2563eb;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#flowArrow)}
      .num{fill:#2563eb;stroke:#fff;stroke-width:2}.numtext{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="32" y="42" class="title">ShopLedger · application architecture</text>
  <text x="32" y="66" class="sub">Verified modules and the order placement path · runtime wiring and file dependencies</text>

  <!-- browser -->
  <rect x="30" y="104" width="202" height="135" class="soft"/>
  <text x="48" y="130" class="head">Browser UI · public/</text>
  <text x="48" y="154">index.html</text><text x="48" y="176">js/app.js</text><text x="48" y="198">css/style.css</text>
  <text x="48" y="222" class="small">POS · orders · Khata · reports</text>

  <!-- server -->
  <rect x="282" y="104" width="190" height="135" class="soft"/>
  <text x="301" y="130" class="head">server.js</text>
  <text x="301" y="154">Express app + JSON body</text><text x="301" y="176">serves public/ and /api</text>
  <text x="301" y="198">GET /orders/:id/invoice</text>
  <text x="301" y="222" class="small">mounts four routers</text>
  <path d="M232 171 H282" class="edge"/>
  <text x="238" y="161" class="small">HTTP</text>

  <!-- route boxes -->
  <rect x="522" y="92" width="250" height="68" class="box"/>
  <text x="540" y="117" class="head">routes/orders.js</text><text x="540" y="141">GET /orders · POST /orders · cancel</text>
  <rect x="522" y="176" width="250" height="58" class="box"/>
  <text x="540" y="200" class="head">routes/products.js</text><text x="540" y="222">GET /products · GET /coupons</text>
  <rect x="522" y="250" width="250" height="58" class="box"/>
  <text x="540" y="274" class="head">routes/customers.js</text><text x="540" y="296">GET /customers · settle</text>
  <rect x="522" y="324" width="250" height="80" class="box"/>
  <text x="540" y="348" class="head">routes/reports.js</text><text x="540" y="370">dashboard · GST reconciliation</text><text x="540" y="391">pricing preview · admin export</text>
  <path d="M472 140 H496 V126 H522" class="edge"/><path d="M496 140 V205 H522" class="edge"/><path d="M496 205 V279 H522" class="edge"/><path d="M496 279 V364 H522" class="edge"/>

  <!-- config -->
  <rect x="895" y="105" width="270" height="100" class="soft"/>
  <text x="914" y="131" class="head">config.js</text>
  <text x="914" y="155">shop · tax HSN slabs · coupons</text>
  <text x="914" y="179">port · inventory · adminKey</text>
  <path d="M895 155 H860 V189 H772" class="edge"/>

  <!-- lib modules -->
  <text x="32" y="283" class="head">lib/ · application logic</text>
  <rect x="30" y="300" width="200" height="72" class="box"/><text x="48" y="326" class="head">lib/orders.js</text><text x="48" y="350">add · get · cancel · list</text>
  <rect x="250" y="300" width="200" height="72" class="box"/><text x="268" y="326" class="head">lib/inventory.js</text><text x="268" y="350">find · check · reserve · release</text>
  <rect x="470" y="430" width="200" height="72" class="box"/><text x="488" y="456" class="head">lib/pricing.js</text><text x="488" y="480">subtotal · computeTotals</text>
  <rect x="690" y="430" width="200" height="72" class="box"/><text x="708" y="456" class="head">lib/coupons.js</text><text x="708" y="480">validate · calculateDiscount</text>
  <rect x="910" y="300" width="240" height="72" class="focus"/><text x="928" y="326" class="head">lib/invoice.js · TICKET FOCUS</text><text x="928" y="350">computeInvoiceFigures · render</text>
  <rect x="910" y="396" width="240" height="72" class="box"/><text x="928" y="422" class="head">lib/tax.js</text><text x="928" y="446">getRateForItem · splitCgstSgst</text>
  <rect x="30" y="400" width="200" height="72" class="box"/><text x="48" y="426" class="head">lib/ledger.js</text><text x="48" y="450">Khata · settlements</text>
  <rect x="250" y="400" width="200" height="72" class="box"/><text x="268" y="426" class="head">lib/dates.js</text><text x="268" y="450">today · normalizeDateKey</text>
  <rect x="30" y="510" width="200" height="72" class="box"/><text x="48" y="536" class="head">lib/reports.js</text><text x="48" y="560">dashboard · GST reconciliation</text>
  <rect x="250" y="510" width="200" height="72" class="box"/><text x="268" y="536" class="head">lib/store.js</text><text x="268" y="560">read · write · appendAudit</text>

  <!-- connections: route dependencies and modules -->
  <path d="M590 160 V282 H130 V300" class="edge"/><path d="M624 160 V282 H350 V300" class="edge"/>
  <path d="M650 160 V414 H570 V430" class="edge"/><path d="M680 160 V414 H790 V430" class="edge"/>
  <path d="M710 160 V238 H130 V400" class="edge"/>
  <path d="M772 364 H882 V336 H910" class="edge"/>
  <path d="M772 364 H882 V432 H910" class="edge"/>
  <path d="M772 364 H460 V546 H450" class="edge"/>
  <path d="M1018 205 V282 H1030 V300" class="edge"/>
  <path d="M1018 205 V382 H1030 V396" class="edge"/>
  <path d="M1018 205 H880 V466 H670" class="edge"/>
  <path d="M1018 205 H902 V360 H910" class="edge"/>
  <path d="M130 372 V400" class="edge"/><path d="M130 472 V510" class="edge"/>
  <path d="M350 372 V400" class="edge"/><path d="M350 472 V510" class="edge"/>
  <path d="M570 502 V546 H450" class="edge"/>
  <path d="M790 430 V414 H772 V160" class="edge"/>
  <path d="M910 455 H880 V490 H670" class="edge"/>

  <!-- persistent data -->
  <path d="M450 546 H487" class="edge"/>
  <path d="M487 546 H510" class="edge"/>
  <rect x="495" y="516" width="220" height="72" class="soft"/>
  <text x="513" y="542" class="head">data/db.json</text><text x="513" y="566">products · orders · customers · audit</text>
  <path d="M230 546 H250" class="edge"/>

  <!-- order flow overlay in lower panel -->
  <rect x="30" y="620" width="1140" height="145" fill="#eef4ff" stroke="#b7c9ed" stroke-width="1.4" rx="10"/>
  <text x="50" y="646" class="head" style="fill:#1d4ed8">ORDER PLACEMENT · numbered request path</text>
  <rect x="50" y="665" width="168" height="68" class="box"/><circle cx="63" cy="665" r="12" class="num"/><text x="63" y="669" class="numtext">1</text><text x="74" y="691" class="head">Browser</text><text x="74" y="714">POST /api/orders</text>
  <rect x="258" y="665" width="200" height="68" class="box"/><circle cx="271" cy="665" r="12" class="num"/><text x="271" y="669" class="numtext">2</text><text x="282" y="691" class="head">routes/orders.js</text><text x="282" y="714">resolve items + validate</text>
  <rect x="498" y="665" width="210" height="68" class="box"/><circle cx="511" cy="665" r="12" class="num"/><text x="511" y="669" class="numtext">3</text><text x="522" y="691" class="head">pricing + tax + coupons</text><text x="522" y="714">compute totals / GST</text>
  <rect x="748" y="665" width="190" height="68" class="box"/><circle cx="761" cy="665" r="12" class="num"/><text x="761" y="669" class="numtext">4</text><text x="772" y="691" class="head">inventory + ledger</text><text x="772" y="714">stock / optional Khata</text>
  <rect x="978" y="665" width="170" height="68" class="box"/><circle cx="991" cy="665" r="12" class="num"/><text x="991" y="669" class="numtext">5</text><text x="1002" y="691" class="head">orders + store</text><text x="1002" y="714">add → audit → write</text>
  <path d="M218 699 H258" class="flow"/><path d="M458 699 H498" class="flow"/><path d="M708 699 H748" class="flow"/><path d="M938 699 H978" class="flow"/>
  <path d="M1063 665 V605 H605 V588" class="flowdash"/>
  <text x="745" y="600" class="small" style="fill:#1d4ed8">store.write(db)</text>

  <!-- invoice route and legend -->
  <path d="M380 104 V88 H1030 V300" class="flowdash"/>
  <text x="756" y="84" class="small" style="fill:#1d4ed8">GET /orders/:id/invoice → invoice.render(order)</text>
  <rect x="824" y="526" width="326" height="64" fill="#fff" stroke="#d1d9e4" rx="8"/>
  <rect x="842" y="542" width="17" height="17" class="focus"/><text x="866" y="555">Ticket focus</text>
  <text x="978" y="555" class="small">Other verified modules shown in gray</text>
</svg>
